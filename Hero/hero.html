<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LearnX – Hero Section</title>
  <link rel="stylesheet" href="hero.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ═══════════════ HERO SECTION ═══════════════ -->
  <section class="hero" id="home">

    <!-- Background Image + Overlay -->
    <div class="hero-bg">
      <img
        src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=1600&auto=format&fit=crop"
        alt="Students learning"
        class="hero-bg-img"
      />
      <div class="hero-overlay"></div>
    </div>

    <!-- Center Content -->
    <div class="hero-content">

      <!-- Badge -->
      <div class="hero-badge">
        <span class="badge-dot"></span>
        <span>Pakistan's #1 Online Learning Platform</span>
      </div>

      <!-- Heading -->
      <h1 class="hero-heading">
        Learn New Skills.<br />
        <span class="highlight">Build Your Future.</span>
      </h1>

      <!-- Subtext -->
      <p class="hero-sub">
        Join over <strong>50,000+ students</strong> who are already learning with
        expert-led courses in development, design, data science, and more —
        at your own pace.
      </p>

      <!-- Buttons -->
      <div class="hero-buttons">
        <button class="btn-primary" id="heroEnrollBtn">Get Started Free</button>
        <button class="btn-secondary" id="heroBrowseBtn">Browse Courses</button>
      </div>

      <!-- Stats -->
      <div class="hero-stats">
        <div class="stat">
          <span class="stat-number">50K+</span>
          <span class="stat-label">Students</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-number">200+</span>
          <span class="stat-label">Courses</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <span class="stat-number">98%</span>
          <span class="stat-label">Success Rate</span>
        </div>
      </div>

    </div>

  </section>

  <script src="hero.js"></script>
</body>
</html>
