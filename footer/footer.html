<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LearnX – Footer</title>
  <link rel="stylesheet" href="footer.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

<!-- ═══════════════════ FOOTER ═══════════════════ -->
<footer class="footer" id="contact">

  <!-- Top Wave -->
  <div class="footer-wave">
    <svg viewBox="0 0 1440 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <path d="M0,40 C360,80 1080,0 1440,40 L1440,0 L0,0 Z" fill="#f0f4ff"/>
    </svg>
  </div>

  <!-- Main Footer Content -->
  <div class="footer-main">
    <div class="footer-grid">

      <!-- Col 1 — Brand -->
      <div class="footer-col brand-col">
        <a href="#" class="footer-logo">
          <img src="logo icon.png" alt="LearnX Logo" />
          <span>LearnX</span>
        </a>
        <p class="brand-desc">
          Pakistan's #1 online learning platform. We empower students with
          expert-led courses in tech, design, and business — at their own pace.
        </p>
        <!-- Social Icons -->
        <div class="social-links">
          <a href="#" class="social-btn" title="Facebook">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
          </a>
          <a href="#" class="social-btn" title="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
              <circle cx="12" cy="12" r="4"/>
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
            </svg>
          </a>
          <a href="#" class="social-btn" title="YouTube">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.96-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="white"/></svg>
          </a>
          <a href="#" class="social-btn" title="LinkedIn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
          </a>
          <a href="#" class="social-btn" title="Twitter/X">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </a>
        </div>
      </div>

      <!-- Col 2 — Quick Links -->
      <div class="footer-col">
        <h4 class="col-title">Quick Links</h4>
        <ul class="footer-links">
          <li><a href="#">Privacy Policy</a></li>
          <li><a href="#">Terms of Service</a></li>
          <li><a href="#">Refund Policy</a></li>
        </ul>
      </div>

      <!-- Col 3 — Newsletter -->
      <div class="footer-col">
        <h4 class="col-title">Get Course Updates</h4>
        <div class="newsletter">
          <div class="newsletter-form">
            <input type="email" id="newsletterEmail" placeholder="Your email address" />
            <button id="newsletterBtn">Subscribe</button>
          </div>
          <p class="newsletter-success" id="newsletterSuccess">✅ Subscribed successfully!</p>
        </div>
      </div>

    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="footer-bottom">
    <p class="copyright">
      &copy; <span id="year"></span> <strong>LearnX</strong>. All rights reserved.
    </p>
  </div>

</footer>

<script src="footer.js"></script>
</body>
</html>
